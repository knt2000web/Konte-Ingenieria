<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StructoPro - Reveal Cinemático 9:16</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background-color: #030712;
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    /* BARRA DE HERRAMIENTAS SUPERIOR */
    .toolbar {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      z-index: 50;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #e2e8f0;
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover {
      background: rgba(20, 88, 245, 0.25);
      border-color: #1458f5;
      color: #ffffff;
      transform: translateY(-1px);
    }

    .btn.active {
      background: #1458f5;
      border-color: #3b82f6;
      color: #ffffff;
      box-shadow: 0 0 20px rgba(20, 88, 245, 0.4);
    }

    /* CONTENEDOR PRINCIPAL FORMATO 9:16 */
    .viewport-9-16 {
      width: 450px;
      height: 800px;
      max-width: 100vw;
      max-height: 90vh;
      aspect-ratio: 9 / 16;
      background: radial-gradient(circle at 50% 45%, #0b1a3a 0%, #060d1d 45%, #02050d 100%);
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* MODO PANTALLA COMPLETA LIMPIO */
    body.clean-mode .toolbar {
      display: none;
    }
    body.clean-mode {
      padding: 0;
      background: #000;
    }
    body.clean-mode .viewport-9-16 {
      border-radius: 0;
      border: none;
      width: 100vw;
      height: 100vh;
      max-width: none;
      max-height: none;
    }

    /* AMBIENTACIÓN CINEMÁTICA Y LUCES DE ESTUDIO */
    .ambient-glow-blue {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(20, 88, 245, 0.18) 0%, rgba(20, 88, 245, 0) 70%);
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 1;
      opacity: 0.8;
      transition: opacity 1s ease;
    }

    .ambient-glow-gold {
      position: absolute;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(245, 200, 66, 0.12) 0%, rgba(245, 200, 66, 0) 70%);
      top: 48%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 1;
      opacity: 0.7;
    }

    .studio-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(2, 5, 13, 0.7) 100%);
      pointer-events: none;
      z-index: 2;
    }

    /* RETÍCULA TÉCNICA DE FONDO (SUAVIZADA) */
    .blueprint-grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 32px 32px;
      background-position: center center;
      pointer-events: none;
      z-index: 1;
      opacity: 0.4;
    }

    /* CONTENEDOR CENTRAL DEL LOGO */
    .stage {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 0 20px;
    }

    /* MÁSCARA PARA BARRIDO DE LUZ (LIGHT SWEEP) */
    .logo-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
    }

    /* DESTELLO DE LUZ METÁLICA */
    .light-sweep-overlay {
      position: absolute;
      top: -20%;
      left: -60%;
      width: 220%;
      height: 140%;
      background: linear-gradient(
        105deg,
        transparent 35%,
        rgba(255, 255, 255, 0.03) 42%,
        rgba(255, 255, 255, 0.5) 50%,
        rgba(245, 200, 66, 0.3) 53%,
        transparent 60%
      );
      transform: translateX(-100%);
      pointer-events: none;
      z-index: 25;
      mix-blend-mode: overlay;
      opacity: 0;
    }

    .animating .light-sweep-overlay {
      animation: sweepPass 1.4s cubic-bezier(0.4, 0, 0.2, 1) 2.4s forwards;
    }

    @keyframes sweepPass {
      0% {
        transform: translateX(-100%);
        opacity: 0;
      }
      20% {
        opacity: 1;
      }
      80% {
        opacity: 1;
      }
      100% {
        transform: translateX(110%);
        opacity: 0;
      }
    }

    /* ESTILOS Y ANIMACIONES: OPCIÓN 1 - ISOMÉTRICO 3D */
    .logo-iso {
      width: 220px;
      height: 220px;
      filter: drop-shadow(0 20px 30px rgba(0, 0, 0, 0.65));
      overflow: visible;
    }

    /* PIEZAS INDIVIDUALES DEL CUBO ISOMÉTRICO */
    .iso-part {
      transform-origin: 200px 200px;
      transition: all 0.5s ease;
    }

    /* CORE CENTRAL */
    .animating .iso-core {
      animation: assembleCore 1.6s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
      opacity: 0;
      transform: scale(0.65);
    }
    @keyframes assembleCore {
      0% {
        opacity: 0;
        transform: scale(0.65);
        filter: brightness(0.4);
      }
      100% {
        opacity: 1;
        transform: scale(1);
        filter: brightness(1);
      }
    }

    /* CARA SUPERIOR (AZUL ARQUITECTURA) */
    .animating .iso-top {
      animation: assembleTop 1.8s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
      opacity: 0;
      transform: translateY(-70px);
    }
    @keyframes assembleTop {
      0% {
        opacity: 0;
        transform: translateY(-70px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* CARA IZQUIERDA (CIMENTACIÓN NAVY) */
    .animating .iso-left {
      animation: assembleLeft 1.8s cubic-bezier(0.16, 1, 0.3, 1) 0.7s forwards;
      opacity: 0;
      transform: translate(-60px, 40px);
    }
    @keyframes assembleLeft {
      0% {
        opacity: 0;
        transform: translate(-60px, 40px);
      }
      100% {
        opacity: 1;
        transform: translate(0, 0);
      }
    }

    /* CARA DERECHA (ACERO Y NORMAS PLATA) */
    .animating .iso-right {
      animation: assembleRight 1.8s cubic-bezier(0.16, 1, 0.3, 1) 0.9s forwards;
      opacity: 0;
      transform: translate(60px, 40px);
    }
    @keyframes assembleRight {
      0% {
        opacity: 0;
        transform: translate(60px, 40px);
      }
      100% {
        opacity: 1;
        transform: translate(0, 0);
      }
    }

    /* ESTILOS Y ANIMACIONES: OPCIÓN 2 - HEXÁGONO ENTERPRISE */
    .logo-hex {
      width: 230px;
      height: 230px;
      filter: drop-shadow(0 20px 30px rgba(0, 0, 0, 0.7));
      overflow: visible;
      display: none;
    }

    .animating .hex-base {
      animation: hexBaseFade 1.6s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
      opacity: 0;
      transform: scale(0.85);
      transform-origin: 70px 70px;
    }
    @keyframes hexBaseFade {
      0% {
        opacity: 0;
        transform: scale(0.85);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .animating .hex-beam {
      stroke-dasharray: 400;
      stroke-dashoffset: 400;
      animation: drawBeam 2.0s cubic-bezier(0.4, 0, 0.2, 1) 0.8s forwards;
    }
    @keyframes drawBeam {
      0% {
        stroke-dashoffset: 400;
        opacity: 0.3;
      }
      50% {
        opacity: 1;
      }
      100% {
        stroke-dashoffset: 0;
        opacity: 1;
      }
    }

    .animating .hex-node {
      animation: popNode 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
    }
    .animating .node-1 { animation-delay: 1.2s; }
    .animating .node-2 { animation-delay: 1.5s; }
    .animating .node-3 { animation-delay: 1.8s; }
    .animating .node-4 { animation-delay: 2.1s; }
    .animating .node-5 { animation-delay: 2.3s; }

    @keyframes popNode {
      0% {
        opacity: 0;
        transform: scale(0);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* TEXTO CORPORATIVO */
    .brand-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 38px;
      font-weight: 900;
      letter-spacing: -1px;
      color: #ffffff;
      margin-top: 28px;
      text-transform: uppercase;
      line-height: 1;
      text-align: center;
      opacity: 0;
    }

    .brand-title .pro-highlight {
      color: #1458f5;
      position: relative;
    }

    .brand-title .pro-gold {
      color: #f5c842;
    }

    .animating .brand-title {
      animation: titleReveal 1.4s cubic-bezier(0.16, 1, 0.3, 1) 1.6s forwards;
    }

    @keyframes titleReveal {
      0% {
        opacity: 0;
        transform: translateY(18px);
        filter: blur(6px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    /* ESGAN INSTITUCIONAL */
    .slogan-container {
      margin-top: 18px;
      padding: 10px 20px;
      border-radius: 999px;
      background: rgba(20, 88, 245, 0.08);
      border: 1px solid rgba(20, 88, 245, 0.2);
      text-align: center;
      opacity: 0;
    }

    .animating .slogan-container {
      animation: sloganReveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) 2.2s forwards;
    }

    @keyframes sloganReveal {
      0% {
        opacity: 0;
        transform: translateY(12px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .slogan-text {
      font-family: 'Rajdhani', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: #94a3b8;
      letter-spacing: 2.8px;
      text-transform: uppercase;
    }

    .slogan-text span {
      color: #ffffff;
    }

    /* PIE DE ENCUADRE TÉCNICO (ESTILO CINEMATOGRÁFICO DE INGENIERÍA) */
    .frame-badge {
      position: absolute;
      bottom: 28px;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #475569;
      font-weight: 600;
      z-index: 10;
    }

    /* RESPLANDOR Y SOMBRA DE CONTACTO FINAL */
    .contact-shadow {
      width: 180px;
      height: 16px;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.8) 0%, rgba(0, 0, 0, 0) 75%);
      margin-top: 14px;
      border-radius: 50%;
      opacity: 0;
      transition: opacity 1.5s ease;
    }

    .animating .contact-shadow {
      animation: shadowReveal 1.8s ease 1.2s forwards;
    }

    @keyframes shadowReveal {
      0% { opacity: 0; transform: scale(0.5); }
      100% { opacity: 0.85; transform: scale(1); }
    }
  </style>
</head>
<body>

  <!-- BARRA DE CONTROL -->
  <div class="toolbar" id="toolbar">
    <button class="btn active" id="btn-iso" onclick="setLogo('iso')">Opción 1: Isométrico 3D</button>
    <button class="btn" id="btn-hex" onclick="setLogo('hex')">Opción 2: Hexágono Enterprise</button>
    <button class="btn" onclick="replayAnimation()">Repetir Ensamblaje</button>
    <button class="btn" onclick="toggleCleanMode()">Modo Limpio / Grabar 9:16</button>
  </div>

  <!-- VIEWPORT CINEMATOGRÁFICO VERTICAL 9:16 -->
  <div class="viewport-9-16" id="viewport">
    
    <!-- ELEMENTOS ESCÉNICOS Y ESTUDIO -->
    <div class="blueprint-grid"></div>
    <div class="ambient-glow-blue"></div>
    <div class="ambient-glow-gold"></div>
    <div class="studio-vignette"></div>

    <div class="stage" id="stage">
      
      <div class="logo-wrapper">
        <div class="light-sweep-overlay"></div>

        <!-- LOGO 1: ISOMÉTRICO 3D (CUBO DE DATOS Y ESTRUCTURA) -->
        <svg class="logo-iso" id="logo-iso" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="coreGrad" x1="200" y1="140" x2="200" y2="260" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#ffdf70" />
              <stop offset="50%" stop-color="#f5c842" />
              <stop offset="100%" stop-color="#cc9b14" />
            </linearGradient>
            
            <linearGradient id="topGrad" x1="200" y1="40" x2="200" y2="160" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#3b78ff" stop-opacity="0.95" />
              <stop offset="100%" stop-color="#0a2d99" stop-opacity="0.95" />
            </linearGradient>

            <linearGradient id="leftGrad" x1="61" y1="160" x2="165" y2="340" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95" />
              <stop offset="100%" stop-color="#020617" stop-opacity="0.95" />
            </linearGradient>

            <linearGradient id="rightGrad" x1="235" y1="160" x2="339" y2="340" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.95" />
              <stop offset="100%" stop-color="#334155" stop-opacity="0.95" />
            </linearGradient>

            <filter id="partShadow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
            </filter>
          </defs>

          <!-- NÚCLEO DORADO CENTRAL (DATOS Y PRECISIÓN) -->
          <g class="iso-part iso-core">
            <polygon points="200,140 252,170 200,200 148,170" fill="url(#coreGrad)" opacity="0.95"/>
            <polygon points="148,170 200,200 200,260 148,230" fill="url(#coreGrad)" filter="brightness(0.75)"/>
            <polygon points="200,200 252,170 252,230 200,260" fill="url(#coreGrad)" filter="brightness(0.88)"/>
          </g>

          <!-- CARA DERECHA (ACERO Y NORMAS ESTRUCTURALES) -->
          <g class="iso-part iso-right" filter="url(#partShadow)">
            <polygon points="235,220 339,160 339,280 235,340" fill="url(#rightGrad)" stroke="#cbd5e1" stroke-width="2" stroke-linejoin="round"/>
            <line x1="287" y1="190" x2="287" y2="310" stroke="rgba(255,255,255,0.22)" stroke-width="2"/>
            <line x1="235" y1="280" x2="339" y2="220" stroke="rgba(255,255,255,0.22)" stroke-width="2"/>
          </g>

          <!-- CARA IZQUIERDA (CIMENTACIÓN Y CONCRETO) -->
          <g class="iso-part iso-left" filter="url(#partShadow)">
            <polygon points="61,160 165,220 165,340 61,280" fill="url(#leftGrad)" stroke="#475569" stroke-width="2" stroke-linejoin="round"/>
            <line x1="113" y1="190" x2="113" y2="310" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
            <line x1="61" y1="220" x2="165" y2="280" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
          </g>

          <!-- CARA SUPERIOR (ARQUITECTURA Y MODELO 3D) -->
          <g class="iso-part iso-top" filter="url(#partShadow)">
            <polygon points="200,40 304,100 200,160 96,100" fill="url(#topGrad)" stroke="#60a5fa" stroke-width="2" stroke-linejoin="round"/>
            <line x1="200" y1="40" x2="200" y2="160" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
            <line x1="96" y1="100" x2="304" y2="100" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
            <circle cx="200" cy="100" r="6" fill="#f5c842"/>
          </g>
        </svg>

        <!-- LOGO 2: HEXÁGONO ENTERPRISE (PLATAFORMA COMPUTACIONAL Y VIGA S) -->
        <svg class="logo-hex" id="logo-hex" viewBox="0 0 140 140" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="hexBgGrad" x1="0" y1="0" x2="140" y2="140" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#0b1e45"/>
              <stop offset="100%" stop-color="#07122a"/>
            </linearGradient>
            <linearGradient id="hexGoldGrad" x1="0" y1="0" x2="140" y2="140" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#f5c842"/>
              <stop offset="100%" stop-color="#c99f24"/>
            </linearGradient>
          </defs>

          <!-- BASE HEXAGONAL -->
          <g class="hex-base">
            <polygon points="70,4 127,37 127,103 70,136 13,103 13,37" fill="url(#hexBgGrad)" stroke="#1e3a8a" stroke-width="1.5"/>
            <line x1="70" y1="4" x2="70" y2="70" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
            <line x1="127" y1="103" x2="70" y2="70" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
            <line x1="13" y1="103" x2="70" y2="70" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
          </g>

          <!-- VIGA S CONTINUA (ENSAMBLAJE DE ACERO) -->
          <path class="hex-beam" d="M 94,36 L 56,36 C 41,36 38,48 38,58 C 38,68 49,70 60,70 L 80,70 C 91,70 102,72 102,82 C 102,92 99,104 84,104 L 46,104" fill="none" stroke="url(#hexGoldGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

          <!-- NODOS ESTRUCTURALES -->
          <polygon class="hex-node node-1" points="94,26 104,36 94,46 84,36" fill="white"/>
          <polygon class="hex-node node-2" points="38,48 48,58 38,68 28,58" fill="white"/>
          <polygon class="hex-node node-3" points="70,60 80,70 70,80 60,70" fill="white"/>
          <polygon class="hex-node node-4" points="102,72 112,82 102,92 92,82" fill="white"/>
          <polygon class="hex-node node-5" points="46,94 56,104 46,114 36,104" fill="white"/>
        </svg>

        <!-- SOMBRA DE CONTACTO -->
        <div class="contact-shadow"></div>
      </div>

      <!-- TIPOGRAFÍA Y MENSAJE DE MARCA -->
      <h1 class="brand-title" id="brand-title">
        STRUCTO<span class="pro-highlight" id="pro-text">PRO</span>
      </h1>

      <div class="slogan-container">
        <p class="slogan-text">LA NORMA ES EL LÍMITE. <span>STRUCTO PRO ES LA HERRAMIENTA.</span></p>
      </div>

    </div>

    <!-- PIE DEL ENCUADRE DE CÁMARA (ESTUDIO NSR-10) -->
    <div class="frame-badge">ESTÁNDAR NSR-10 / ACI-318 · INGENIERÍA ESTRUCTURAL</div>

  </div>

  <script>
    let currentLogo = 'iso';

    function runAnimation() {
      const stage = document.getElementById('stage');
      stage.classList.remove('animating');
      void stage.offsetWidth; // Forzar reflow para reiniciar la animación
      stage.classList.add('animating');
    }

    function setLogo(type) {
      currentLogo = type;
      const logoIso = document.getElementById('logo-iso');
      const logoHex = document.getElementById('logo-hex');
      const btnIso = document.getElementById('btn-iso');
      const btnHex = document.getElementById('btn-hex');
      const proText = document.getElementById('pro-text');

      if (type === 'iso') {
        logoIso.style.display = 'block';
        logoHex.style.display = 'none';
        btnIso.classList.add('active');
        btnHex.classList.remove('active');
        proText.className = 'pro-highlight';
      } else {
        logoIso.style.display = 'none';
        logoHex.style.display = 'block';
        btnIso.classList.remove('active');
        btnHex.classList.add('active');
        proText.className = 'pro-gold';
      }

      runAnimation();
    }

    function replayAnimation() {
      runAnimation();
    }

    function toggleCleanMode() {
      document.body.classList.toggle('clean-mode');
    }

    // Doble clic o presionar Escape para salir del modo limpio
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' || e.key === ' ') {
        if (e.key === ' ') {
          e.preventDefault();
          replayAnimation();
        } else {
          document.body.classList.remove('clean-mode');
        }
      }
    });

    // Iniciar animación automáticamente al cargar
    window.addEventListener('DOMContentLoaded', () => {
      runAnimation();
    });
  </script>
</body>
</html>
